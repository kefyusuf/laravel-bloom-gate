name: RC Pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rc-pilot.yml'
      - 'tests/Distribution/redis-pilot.php'
      - 'tests/Distribution/smoke.php'
      - 'tests/Distribution/prepare-dist.php'

permissions:
  contents: read

jobs:
  redis-sqlite:
    runs-on: ubuntu-latest
    env:
      RC_TAG: v0.1.0-rc.1
      RC_SHA: 77401a64b76ea7ceb47a6254fd1f38b3a0d09aca

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: redis, pdo_sqlite, zip
          tools: composer:v2

      - name: Verify published tag and prepare production consumer
        run: |
          actual=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RC_TAG}^{}" | cut -f1)
          test "$actual" = "$RC_SHA"
          mkdir -p .build/rc-archive .build/rc-consumer
          curl --fail --location --retry 3 --output .build/rc.zip "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RC_TAG}.zip"
          unzip -q .build/rc.zip -d .build/rc-archive
          php tests/Distribution/verify.php .build/rc-archive/*
          php tests/Distribution/prepare-dist.php .build/rc-archive/*/composer.json .build/rc-consumer "file://${PWD}/.build/rc.zip" "$RC_SHA" 0.1.0-rc.1
          cp tests/Distribution/smoke.php tests/Distribution/redis-pilot.php .build/rc-consumer/

      - name: Install production dependencies
        working-directory: .build/rc-consumer
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Verify RC dist and consumer boot
        run: |
          php tests/Distribution/verify-dist.php .build/rc-consumer "$RC_SHA"
          php .build/rc-consumer/smoke.php

      - name: Verify smoke failure exit after Laravel bootstrap
        run: |
          if DISTRIBUTION_SMOKE_FORCE_FAILURE=1 php .build/rc-consumer/smoke.php > .build/rc-smoke-negative.log 2>&1; then
            cat .build/rc-smoke-negative.log
            exit 1
          fi
          grep -F 'Injected smoke failure after Laravel bootstrap.' .build/rc-smoke-negative.log

      - name: Start isolated durable-profile Redis
        run: |
          docker run --detach --name lbg-rc-pilot -p 127.0.0.1:6379:6379 redis:8-alpine redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
          for attempt in $(seq 1 30); do
            if docker exec lbg-rc-pilot redis-cli ping | grep -q '^PONG'; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Verify failure exit and SQL fallback without asserted profile
        run: |
          if php .build/rc-consumer/redis-pilot.php > .build/rc-negative.log 2>&1; then
            cat .build/rc-negative.log
            exit 1
          fi
          grep -F 'Safe negative did not skip the authoritative SQL lookup.' .build/rc-negative.log

      - name: Verify SQL transactions and Redis coordination
        env:
          PILOT_PROFILE: standalone-primary-durable-v1
        run: php .build/rc-consumer/redis-pilot.php

      - name: Stop isolated Redis
        if: always()
        run: docker rm --force lbg-rc-pilot
