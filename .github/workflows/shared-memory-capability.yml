name: Shared Memory Capability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/shared-memory-capability.yml'
      - 'tests/Experiments/Swoole/**'
      - 'composer.json'
      - 'phpstan.neon.dist'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify native capability, coherent QueryGate and sealed dataset
        env:
          SHARED_MEMORY_TASK: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tests/Experiments/Swoole/run.sh
