name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example you can.
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
  - type: input
    id: laravel
    attributes:
      label: Laravel version
  - type: input
    id: redis
    attributes:
      label: Redis version
  - type: textarea
    id: safety
    attributes:
      label: Correctness or safety impact
      description: Note any incorrect bypass, stale-state, key-collision, or synchronization behavior.
