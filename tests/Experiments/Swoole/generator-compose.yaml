services:
  php:
    build:
      context: .
    image: lbg-generator-php:${GENERATOR_TASK:?Set a current-task label}
    command: ["php", "/fixture/generator-server.php"]
    cpus: 2
    mem_limit: 256m
    volumes:
      - .:/fixture:ro
      - ../../../.build/generator-qualification:/results
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/generator-info')===false?1:0);"]
      interval: 2s
      timeout: 2s
      retries: 30
  k6:
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    profiles: ["load"]
    cpus: 4
    mem_limit: 4g
    user: "0:0"
    volumes:
      - .:/fixture:ro
      - ../../../.build/generator-qualification:/results
