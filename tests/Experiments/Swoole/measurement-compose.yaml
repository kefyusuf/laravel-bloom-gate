services:
  php:
    environment:
      DEMO_REDIS_HOST: redis
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    cpus: 2
    mem_limit: 1g
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  k6:
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    profiles: ["load"]
    cpus: 2
    mem_limit: 1g
    user: "0:0"
    volumes:
      - .:/fixture:ro
      - ../../../.build/swoole-measurement:/results
volumes:
  redis:
