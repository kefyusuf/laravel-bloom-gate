events {}

http {
    server {
        listen 80;
        root /consumer;

        location = /fpm-fixture.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /consumer/fpm-fixture.php;
            fastcgi_pass fpm:9000;
            fastcgi_read_timeout 60s;
        }

        location / {
            return 404;
        }
    }
}
